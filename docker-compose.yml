---
services:
  postgres:
    image: postgres:15
    container_name: pg-avalon
    environment:
      POSTGRES_DB: avalon
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-avalon
    environment:
      MINIO_ROOT_USER: minioaccesskey
      MINIO_ROOT_PASSWORD: miniosecretkey
    ports:
      - "9000:9000"
    command: server /data